# Runs your tests on GitHub every time you commit a change or open a pull request.
# See the result in the Actions tab: green check = all passed, red X = a test failed.
name: UCTP tests

on:
  push:
  pull_request:
  workflow_dispatch:   # adds a "Run workflow" button in the Actions tab

jobs:
  api:
    name: API tests (Node)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm run test:api
      - name: Keep the API report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: api-report
          path: reports/*.json
          retention-days: 14

  web:
    name: Web tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:web
      - name: Keep the web report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: web-report
          path: reports/web/
          retention-days: 14
